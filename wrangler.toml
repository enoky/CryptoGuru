# One Cloudflare Worker serves the built app (dist/) and the /api endpoints,
# and runs the cron job that refreshes the market snapshot. Free tier only.
name = "cryptoguru"
main = "worker/index.ts"
compatibility_date = "2026-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# No id on purpose: on the first deploy, Wrangler creates this KV namespace
# (named after the Worker) and keeps using it on later deploys. To use one you
# made yourself, add its id here.
[[kv_namespaces]]
binding = "SNAPSHOTS"

[triggers]
# Snapshot every 10 min; signal batches 5 min later. Must match SNAPSHOT_CRON / SIGNALS_CRON in worker/app.ts.
crons = ["*/10 * * * *", "5-59/10 * * * *"]

# Secret (never in this file): COINGECKO_DEMO_KEY. The Deploy workflow copies it from the
# GitHub secret of the same name; or set it with: npx wrangler secret put COINGECKO_DEMO_KEY
