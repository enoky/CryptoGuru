<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CryptoGuru</title>
    <meta name="description" content="Live prices, charts and plain-English market context for popular crypto assets. Free, no sign-up, no tracking." />
    <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0f17" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fa" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://coin-images.coingecko.com" crossorigin />
    <script>
      // Apply the saved theme before first paint so the page doesn't flash.
      try {
        const t = JSON.parse(localStorage.getItem('theme') || '"system"');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>CryptoGuru needs JavaScript to load live market data.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
