name: API contract check

# Calls every real API once a day and opens an issue if one has changed shape.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check live APIs
        id: check
        continue-on-error: true
        env:
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_DEMO_KEY }}
        run: npx vitest run --config vitest.contract.config.ts --reporter=default --reporter=json --outputFile.json=contract-report.json
      - name: Open, update or close the tracking issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.check.outcome }}
        with:
          script: |
            const fs = require('fs');
            const run = require('./scripts/contract-issue.cjs');
            let report = null;
            try { report = JSON.parse(fs.readFileSync('contract-report.json', 'utf8')); } catch {}
            const result = await run({ github, context, outcome: process.env.OUTCOME, report });
            core.info(`Issue: ${result}`);
      - name: Fail the run if the check failed
        if: steps.check.outcome == 'failure'
        run: exit 1
